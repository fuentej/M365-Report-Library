name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Pester 5
        shell: pwsh
        run: |
          $installed = Get-Module Pester -ListAvailable | Where-Object { $_.Version -ge [version]'5.0.0' }
          if (-not $installed) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          (Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version.ToString()

      - name: Run the tests
        shell: pwsh
        run: |
          Invoke-Pester -Path ./shared/tests, ./reports/guest-access/tests -CI
          # -CI does set Run.Exit, so a failing run already exits non-zero: against a
          # deliberately failing test this step exits 1 with -CI and 0 without it, and
          # that held even through the nested `pwsh -Command` this step used to use.
          # Leaving the exit explicit anyway, so the check stays red if -CI is ever
          # dropped from the line above.
          exit $LASTEXITCODE
